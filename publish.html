<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>发布信息</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h2>发布寻物/招领信息</h2>
            <a href="index.html" class="btn back-btn">返回首页</a>
        </header>
        <form id="publishForm">
            <div class="form-item">
                <label>类型</label>
                <select id="type">
                    <option value="lost">寻物（我丢了东西）</option>
                    <option value="found">招领（捡到东西）</option>
                </select>
            </div>
            <div class="form-item">
                <label>标题</label>
                <input type="text" id="title" placeholder="例如：校园卡丢失">
            </div>
            <div class="form-item">
                <label>物品名称</label>
                <input type="text" id="itemName" placeholder="例如：校园卡">
            </div>
            <div class="form-item">
                <label>描述信息</label>
                <textarea id="desc" placeholder="丢失地点、时间等信息"></textarea>
            </div>
            <div class="form-item">
                <label>联系方式</label>
                <input type="text" id="contact" placeholder="手机号/QQ">
            </div>
            <button type="submit" class="btn submit-btn">提交发布</button>
        </form>
    </div>
    <script src="js/main.js"></script>
    <script>
        document.getElementById('publishForm').addEventListener('submit',function(e){
            e.preventDefault();
            addItem();
            alert("发布成功！");
            window.location.href="index.html";
        })
    </script>
</body>
</html>
