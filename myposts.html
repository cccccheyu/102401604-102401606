</head>
<body>
    <nav class="nav">
        <div class="nav-inner">
            <span class="logo">🎒 校园失物招领</span>
            <div class="nav-links">

                <a href="publish.html">发布信息</a>

        <h2>我的发布</h2>
        <div class="my-name-box">
            <label>我的称呼：</label>
            <input type="text" id="myNameInput" placeholder="输入你发布时填的称呼">
            <button class="btn btn-primary" onclick="loadMyPosts()">查看</button>
        </div>
        <div id="myList" class="card-grid"></div>

    <script src="js/main.js"></script>

        window.onload = function(){
            document.getElementById('myNameInput').value = localStorage.getItem("myName") || "";
            loadMyPosts();
        };
    </script>
